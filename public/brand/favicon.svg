<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="One Global People">
  <title>One Global People — Canonical One Global Logo</title>
  <!--
    Logo 2, the Canonical One Global Logo, at favicon scale. "The ecosystem has structure."

    Six bands woven around a centre that is left OPEN — the second logo version, the one whose
    centre reads unambiguously as an entrance rather than an emblem (§2.12, §8.6.2). At 16px the
    weave resolves to a ring with a hole in it, which is the correct reading: the opening is the
    part that must survive scaling.

    Gold family only, muted and dimensional: #6e5320 shadow side, #d9a64a body, #ffe9c2 glints.
    No neon, no lens flare, no gradient wide enough to band (§8.2.2, §8.9).

    This is an engineering placeholder. The production mark comes from the Design Bible assets
    (A-001 / A-002 / C-001) once the founder confirms which is the "second logo version".
  -->
  <defs>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e5320" />
      <stop offset="45%" stop-color="#d9a64a" />
      <stop offset="70%" stop-color="#ffe9c2" />
      <stop offset="100%" stop-color="#b58a45" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#strand)" stroke-width="3.4" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="26" ry="12" transform="rotate(0 32 32)" />
    <ellipse cx="32" cy="32" rx="26" ry="12" transform="rotate(60 32 32)" />
    <ellipse cx="32" cy="32" rx="26" ry="12" transform="rotate(120 32 32)" />
  </g>

  <!-- The opening. Cut, not drawn: the centre is absence, and absence is the point. -->
  <circle cx="32" cy="32" r="8.5" fill="#030307" />
  <circle cx="32" cy="32" r="8.5" fill="none" stroke="#6e5320" stroke-width="0.8" opacity="0.7" />
</svg>
