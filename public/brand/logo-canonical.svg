<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="One Global People">
  <title>One Global People — Canonical One Global Logo</title>
  <!--
    Logo 2, the Canonical One Global Logo, at presentation scale. "The ecosystem has structure."

    Clear space: at least 0.5x the emblem width on every side — 256 units in this viewBox.
    Minimum render size: 24px (the favicon is the only exception).
    The mark appears only on dark fields. Never boxed. Never on white. (§8.6.4)

    Six bands, woven, around an open centre. The strands represent life, humanity, nature,
    memory, relationship and return; the centre is revealed to have always been an opening
    (§2.5). Nothing here splits, stretches or mechanically opens — the depth does the work.

    Gold stays muted, refined, polished, warm and dimensional. The shadow side (#6e5320) is what
    makes it read as woven rather than printed; without it the mark flattens into a sticker.

    Engineering placeholder pending the Design Bible assets. See ./README.md.
  -->
  <defs>
    <linearGradient id="strandA" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6e5320" />
      <stop offset="38%" stop-color="#b58a45" />
      <stop offset="62%" stop-color="#d9a64a" />
      <stop offset="88%" stop-color="#ffe9c2" />
      <stop offset="100%" stop-color="#8a6a2e" />
    </linearGradient>
    <linearGradient id="strandB" x1="0.9" y1="0.1" x2="0.1" y2="0.9">
      <stop offset="0%" stop-color="#8a6a2e" />
      <stop offset="34%" stop-color="#d9a64a" />
      <stop offset="66%" stop-color="#b58a45" />
      <stop offset="100%" stop-color="#6e5320" />
    </linearGradient>
    <radialGradient id="centreDepth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#030307" />
      <stop offset="72%" stop-color="#06060c" />
      <stop offset="100%" stop-color="#120e08" />
    </radialGradient>
  </defs>

  <!-- Outer weave: three long bands, each crossing the other two. -->
  <g fill="none" stroke-linecap="round" stroke-width="17">
    <ellipse cx="256" cy="256" rx="208" ry="96" stroke="url(#strandA)" transform="rotate(0 256 256)" />
    <ellipse cx="256" cy="256" rx="208" ry="96" stroke="url(#strandB)" transform="rotate(60 256 256)" />
    <ellipse cx="256" cy="256" rx="208" ry="96" stroke="url(#strandA)" transform="rotate(120 256 256)" />
  </g>

  <!-- Inner weave: three shorter bands, offset, giving the strands somewhere to pass behind. -->
  <g fill="none" stroke-linecap="round" stroke-width="11" opacity="0.85">
    <ellipse cx="256" cy="256" rx="150" ry="68" stroke="url(#strandB)" transform="rotate(30 256 256)" />
    <ellipse cx="256" cy="256" rx="150" ry="68" stroke="url(#strandA)" transform="rotate(90 256 256)" />
    <ellipse cx="256" cy="256" rx="150" ry="68" stroke="url(#strandB)" transform="rotate(150 256 256)" />
  </g>

  <!-- The opening. It is not a hole punched in a logo; it is what the logo is arranged around. -->
  <circle cx="256" cy="256" r="72" fill="url(#centreDepth)" />
  <circle cx="256" cy="256" r="72" fill="none" stroke="#6e5320" stroke-width="2.5" opacity="0.55" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#8a6a2e" stroke-width="1.2" opacity="0.3" />
</svg>
